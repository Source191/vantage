name: pipeline

# The one pipeline every pull request and every merge goes through: it checks a pull request, and on main it checks
# and, when Version changed, releases. Runs on every pull request, whatever its base, and every push to main. A pull
# request stacked on another branch is checked against that branch, so each one in a stack is green before it is
# retargeted to main. Branch protection on main requires the `check` job (the job's name, not this file's), so a red
# pull request cannot merge. Windows only: the code uses P/Invoke, ConPTY and cmd.exe in the integration tests.
# (ConPTY: https://learn.microsoft.com/windows/console/creating-a-pseudoconsole-session)
#
# A push to main that changes Version in src/Source191.Torni/Source191.Torni.csproj is also a release: the check
# job zips the winget build named for the plain Version, smoke-tests that zip, and the release job publishes it as a
# GitHub Release, so each merge builds and tests once and a commit whose check failed is never released; a stable
# release reaches winget only when the owner runs publish.yml for it. Bumping the version (already required, because
# each merge that changes the program is a release) is the same action that decides whether a release happens.
on:
  pull_request:
  push:
    branches: [main]

# A new commit on a pull request cancels the run for the older one, whose result branch protection no longer reads.
# Each push to main has a group of its own (its run id), so it is never cancelled or queued behind another.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job but release: check and handoff run the downloaded Claude Code installer, and the
# handoff job runs a live Claude session in the checkout. The release job raises its own rights and checks nothing out.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: windows-latest
    timeout-minutes: 20
    # For the release job: set only on a push to main that changed Version.
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      version: ${{ steps.package.outputs.version }}
    # For the smoke check's Claude Code CLI, as in handoff: it must not update itself mid-run. The DOTNET_ variables
    # keep the SDK's first run quiet and send no telemetry from CI.
    env:
      DISABLE_AUTOUPDATER: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
    steps:
      # The job's token is never left in .git\config: only the Dependabot step pushes, with a token of its own on the
      # URL. Depth 2 keeps both parents of a pull request's merge ref for the version check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Dependabot never raises Version or writes a changelog line, so for its pull requests that touch the tool this raises
      # Version one step and adds the pull request's title under Unreleased, Internal, on the pull request's own branch,
      # and pushes the commit with DEPENDABOT_BUMP_TOKEN, a fine-grained personal access token
      # (Contents read and write on this repository) held as a Dependabot secret: the only secrets a Dependabot run can
      # read, and a push made with GITHUB_TOKEN would start no new run. That push starts the run branch protection
      # reads; this one skips its own version check and carries on. With the secret empty (a person pushed to the
      # branch, so the run has repository secrets instead) it only says to raise Version by hand.
      - name: Check out the Dependabot branch
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          path: dependabot-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Raise the version for Dependabot
        id: bump
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        shell: pwsh
        working-directory: dependabot-branch
        env:
          BUMP_TOKEN: ${{ secrets.DEPENDABOT_BUMP_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          .github/scripts/Assert-VersionBumped.ps1 -Base "origin/$env:BASE_REF" -Head HEAD *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host 'Version is already raised, or nothing that ships changed.'
              exit 0
          }

          if ([string]::IsNullOrEmpty($env:BUMP_TOKEN)) {
              Write-Host '::notice::DEPENDABOT_BUMP_TOKEN is not available to this run, so Version was not raised: run .github/scripts/Step-Version.ps1 and .github/scripts/Add-InternalChangelogEntry.ps1, and push.'
              exit 0
          }

          $version = .github/scripts/Step-Version.ps1
          .github/scripts/Add-InternalChangelogEntry.ps1 -Text "$env:PR_TITLE (#$env:PR_NUMBER)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet --all --message "Raise Version to $version and add the changelog line for the dependency update"
          if ($LASTEXITCODE -ne 0) {
              throw "git commit failed with exit code $LASTEXITCODE."
          }

          git push --quiet "https://x-access-token:$env:BUMP_TOKEN@github.com/$env:REPOSITORY.git" "HEAD:$env:HEAD_REF"
          if ($LASTEXITCODE -ne 0) {
              Write-Host '::error::Pushing the version bump failed: DEPENDABOT_BUMP_TOKEN may have expired. Renew it under Settings, Secrets and variables, Dependabot (MAINTAINING.md, Dependabot and the version bump token).'
              exit 1
          }

          Write-Host "::notice::Raised Version to $version and pushed it; the run for that commit is the one that counts."
          'pushed=true' >> $env:GITHUB_OUTPUT

      # A pull request that changes the packaged tool must raise Version. The checkout is GitHub's
      # merge ref: HEAD^1 is the tip of the base branch (main, or the parent of a stacked pull request)
      # it was built on and HEAD is that branch after the merge, so the diff is exactly what the pull
      # request changes. First, so a missing bump fails before the build; skipped when the step above pushed one.
      - name: Check the version was raised
        if: github.event_name == 'pull_request' && steps.bump.outputs.pushed != 'true'
        shell: pwsh
        run: .github/scripts/Assert-VersionBumped.ps1 -Base HEAD^1 -Head HEAD

      # The same comparison for CHANGELOG.md, the release notes the zip carries: a change to the packaged tool adds a
      # line under Unreleased, and a change that raises Version to a stable version turns Unreleased into that version's
      # section (CONTRIBUTING.md, Pull requests).
      - name: Check the changelog was updated
        if: github.event_name == 'pull_request' && steps.bump.outputs.pushed != 'true'
        shell: pwsh
        run: .github/scripts/Assert-ChangelogUpdated.ps1 -Base HEAD^1 -Head HEAD

      # A pull request that changes only documentation (openspec\, or .md files outside .github\) passes here
      # without building: nothing it changes is compiled, tested or run. Every later step checks the output, so the
      # job still runs and reports `check`, which branch protection requires (a workflow-level paths-ignore would
      # leave that check pending for ever). Pushes to main always run every step.
      - name: Skip the build for a documentation-only change
        id: documentation
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (.github/scripts/Test-DocumentationOnly.ps1 -Base HEAD^1 -Head HEAD) {
              Write-Host '::notice::Documentation-only change: the build, tests, zip and smoke check were skipped.'
              'skip=true' >> $env:GITHUB_OUTPUT
          }

      # The installer runs in a process of its own while the build runs, and "Finish the Claude Code install"
      # waits for it. Start-Process, not Start-Job: a job would end with this step's PowerShell, while the runner
      # ends leftover processes only when the job ends. No secret is in this job's environment.
      - name: Start the Claude Code install
        id: claude
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'claude-install.log'
          $process = Start-Process pwsh -PassThru -ArgumentList '-NoLogo', '-NoProfile', '-Command', "irm https://claude.ai/install.ps1 | iex *> '$log'"
          "pid=$($process.Id)" >> $env:GITHUB_OUTPUT
          Write-Host "Claude Code install started as process $($process.Id), logging to $log."

      # The NuGet global packages folder, keyed on every file that decides what is restored. GitHub scopes caches by
      # ref: a pull request reads main's cache but writes only its own, and main never reads a pull request's, so only
      # runs on main write the cache a release build restores from. (https://github.com/actions/cache)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.documentation.outputs.skip != 'true'
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'nuget.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # A push to main that changes Version is a release: its zip is named for the plain Version, and the smoke check
      # below runs that very zip, which the release job then publishes. Every other run names its zip
      # <Version>-ci.<run number>, so it is never taken for a release's. The suffix is worked out here because an
      # expression such as `changed && '' || x` always gives x. The pushed commit is compared with its first parent,
      # which for the merge and squash commits this repository uses is the previous tip of main, so a whole pull
      # request is in view.
      - name: Decide the release version
        id: package
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = "ci.$env:RUN_NUMBER"
          if ($env:GITHUB_EVENT_NAME -ne 'push') {
              "suffix=$suffix" >> $env:GITHUB_OUTPUT
              exit 0
          }
          $csproj = 'src/Source191.Torni/Source191.Torni.csproj'
          git diff --quiet HEAD^ HEAD -- $csproj
          $diff = $LASTEXITCODE
          if ($diff -eq 0) {
              Write-Host "$csproj unchanged in this push: nothing to release."
              "suffix=$suffix" >> $env:GITHUB_OUTPUT
              exit 0
          }
          if ($diff -ne 1) {
              throw "git diff failed with exit code $diff; refusing to guess whether Version changed."
          }
          # A regex rather than an [xml] cast: git's output comes through the console encoding, and a byte
          # order mark would break the cast.
          # The first parent may be older than the rename to Torni, when the csproj had its old path.
          $beforePath = $csproj
          git cat-file -e "HEAD^:$csproj" 2>$null
          if ($LASTEXITCODE -ne 0) {
              $beforePath = 'src/Source191.Vantage/Source191.Vantage.csproj'
          }
          $before = [regex]::Match((git show "HEAD^:$beforePath" | Out-String), '<Version>\s*([^<]+?)\s*</Version>').Groups[1].Value
          $after = (Select-Xml -Path $csproj -XPath '//Version').Node.InnerText
          if ([string]::IsNullOrWhiteSpace($before) -or [string]::IsNullOrWhiteSpace($after)) {
              throw "Could not read Version from $csproj (before='$before', after='$after')."
          }
          if ($before -eq $after) {
              Write-Host "$csproj changed but Version did not ($before): nothing to release."
              "suffix=$suffix" >> $env:GITHUB_OUTPUT
              exit 0
          }
          Write-Host "Version changed: $before -> $after; zipping it for the release."
          "changed=true" >> $env:GITHUB_OUTPUT
          "version=$after" >> $env:GITHUB_OUTPUT
          "suffix=" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/build-test-pack
        id: build
        if: steps.documentation.outputs.skip != 'true'
        with:
          version-suffix: ${{ steps.package.outputs.suffix }}

      # The winget build from any commit, the way a preview is tried: tools\install-local.ps1 -FromArtifact <downloaded
      # folder> extracts it. The zip is uploaded as it is, so the artefact holds the zip a release would attach.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.documentation.outputs.skip != 'true'
        with:
          name: torni-${{ steps.build.outputs.version }}-win-x64
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      # The smoke check (.claude\rules\checks.md, "Smoke check of the packed tool") runs the zip a user would install, so a
      # missing DLL or a screen that no longer opens fails the pull request. The console needs the Claude Code CLI to
      # start; signed out, `claude agents --json` prints [] and the sessions view is simply empty. No workspace
      # trust is seeded: the smoke check never starts a session. If the background install is not there, it is run
      # again in the foreground, so the job never depends on the background process having survived.
      - name: Finish the Claude Code install
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        env:
          INSTALL_PID: ${{ steps.claude.outputs.pid }}
        run: |
          $ErrorActionPreference = 'Stop'
          Wait-Process -Id $env:INSTALL_PID -Timeout 300 -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP 'claude-install.log'
          if (Test-Path $log) { Get-Content $log }
          $claude = "$env:USERPROFILE\.local\bin\claude.exe"
          if (-not (Test-Path $claude)) {
              Write-Host '::warning::The background Claude Code install did not finish; installing in the foreground.'
              irm https://claude.ai/install.ps1 | iex
          }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
          & $claude --version

      # The runner has no config.json, so the default roots apply: repositories in ~\source\repos and worktrees in
      # ~\source\worktrees. The linked worktree is the one force remove is opened (and cancelled) on; it must have
      # no session in it, or the removal is refused with no dialog.
      - name: Seed a repository for the smoke check
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repository = Join-Path $env:USERPROFILE 'source\repos\Northwind.Smoke'
          New-Item -ItemType Directory -Force $repository | Out-Null
          git -C $repository init --initial-branch main
          # Two solutions, neither named after the repository, so s on the worktree asks which one.
          New-Item -ItemType File (Join-Path $repository 'Api.sln'), (Join-Path $repository 'Worker.sln') | Out-Null
          git -C $repository add Api.sln Worker.sln
          git -C $repository -c user.name=Smoke -c user.email=smoke@example.invalid commit -m 'First commit'
          git -C $repository worktree add -b smoke (Join-Path $env:USERPROFILE 'source\worktrees\Northwind.Smoke-smoke')

      # Into a folder of its own, as winget extracts a portable zip, so the exe that runs is the one in the zip with
      # only the zip's files beside it.
      - name: Unzip the winget build
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        env:
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath $env:ZIP -DestinationPath "$env:RUNNER_TEMP\winget-zip"

      # `torni --version` prints exactly the csproj Version, with no commit after it: what a release shows on GitHub
      # and in winget. A check run names its zip Version-ci.<run>, but the assembly keeps Version.
      - name: Check the unzipped build's version
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (Select-Xml -Path src\Source191.Torni\Source191.Torni.csproj -XPath '//Version').Node.InnerText
          $printed = (& "$env:RUNNER_TEMP\winget-zip\torni.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $printed -ne $expected) {
              throw "torni --version printed '$printed' (exit $LASTEXITCODE); expected '$expected'."
          }

      - name: Smoke check
        if: steps.documentation.outputs.skip != 'true'
        shell: pwsh
        working-directory: tools\HeadlessTerminal
        run: dotnet run --project . -c Release --no-build -- smoke "$env:RUNNER_TEMP\winget-zip\torni.exe" Northwind.Smoke-smoke

      # Read it with the tool's `grid drive-raw.txt <marker>` or `count`; the failed step is named in the log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-capture
          path: tools\HeadlessTerminal\drive-raw.txt
          if-no-files-found: ignore

      # A stable release's notes start with its CHANGELOG.md section, written beside the zip so the artefact stays
      # flat; a prerelease's file is empty and unused. The release job checks nothing out, so the notes travel with the
      # zip. After the smoke check, so a zip that failed it is never handed to the release job.
      - name: Write the release notes
        id: notes
        if: steps.package.outputs.changed == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path (Split-Path $env:ZIP) 'release-notes.md'
          .github/scripts/Write-ReleaseNotes.ps1 -Version $env:VERSION -Destination $notes
          "path=$notes" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.package.outputs.changed == 'true'
        with:
          name: release
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.notes.outputs.path }}
          if-no-files-found: error

  # Attests and publishes the zip the check job built, tested and smoke-checked, and nothing else: it checks nothing out
  # and runs no build, so the write and signing rights are held only by steps that download, attest and call gh. Only a
  # push to main that changed Version gets this far.
  release:
    name: Publish the release
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    # contents to publish the release; id-token and attestations to sign the zip's provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Find the zip
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem release -Filter 'torni_*_win-x64.zip')
          if ($zips.Count -ne 1) {
              throw "Expected exactly one torni_<version>_win-x64.zip in the check job's artefact, found $($zips.Count)."
          }
          "path=$($zips[0].FullName)" >> $env:GITHUB_OUTPUT

      # Signed build provenance for the zip: which commit and workflow built it, kept by GitHub, so anyone can check it
      # with gh attestation verify before an install. The attestation is made on the downloaded bytes, which are the ones released.
      # (https://docs.github.com/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds,
      # https://cli.github.com/manual/gh_attestation_verify)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      # gh is on the runner, so no third-party action is needed for the release itself. A version with a
      # prerelease label (0.16.2-preview.1; the csproj never carries build metadata) is published as a
      # GitHub prerelease, so it never becomes the repository's Latest release. Nothing is checked out, so the
      # repository is named. A stable release's notes are its CHANGELOG.md section, which gh puts before the generated
      # list (gh release create --help: notes given with the generated ones are prepended), and the list starts at the
      # previous stable release's tag, so it covers every preview since; a prerelease keeps the generated notes alone.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @("v$env:VERSION", $env:ZIP, '--repo', $env:GITHUB_REPOSITORY, '--title', "v$env:VERSION", '--generate-notes', '--target', $env:GITHUB_SHA)
          if ($env:VERSION.Contains('-')) {
              $arguments += '--prerelease'
          }
          else {
              $arguments += '--notes-file', (Join-Path (Split-Path $env:ZIP) 'release-notes.md')
              $previous = gh release list --repo $env:GITHUB_REPOSITORY --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release list failed with exit code $LASTEXITCODE."
              }
              if (-not [string]::IsNullOrWhiteSpace($previous)) {
                  $arguments += '--notes-start-tag', $previous.Trim()
              }
          }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }

  # The hand-off check against a real Claude session (.claude\rules\checks.md, "Hand-off check"): torni here
  # starts a throwaway session with no prompt, attaches, and is detached with Ctrl+Z. Needs the
  # CLAUDE_CODE_OAUTH_TOKEN secret from `claude setup-token` (https://code.claude.com/docs/en/github-actions);
  # without it every step after the gate
  # is skipped. continue-on-error because a slow runner can fail it for reasons that are not bugs:
  # read the handoff-capture artefact when it does. Exit 1 is torni here not exiting after the
  # detach, 3 is Claude's screen missing from the capture (the attach never reached Claude). Claude's
  # screen is in the artefact, not this log: read it with the tool's `count drive-raw.txt "Claude Code v"`.
  handoff:
    name: handoff
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    # The token is given only to the hand-off check, never to the job, so the downloaded installer and the
    # build never see it; the gate sees only whether it exists.
    env:
      DISABLE_AUTOUPDATER: 1
    steps:
      # Depth 2 keeps both parents of a pull request's merge ref for the documentation gate, as in check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # One output for both reasons to skip: no token, or a pull request that changes only documentation.
      - name: Gate on the token secret and the change
        id: gate
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HAS_TOKEN -ne 'true') {
              Write-Host "::notice::handoff skipped: no CLAUDE_CODE_OAUTH_TOKEN secret"
              "enabled=false" >> $env:GITHUB_OUTPUT
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and (.github/scripts/Test-DocumentationOnly.ps1 -Base HEAD^1 -Head HEAD)) {
              Write-Host "::notice::handoff skipped: documentation-only change"
              "enabled=false" >> $env:GITHUB_OUTPUT
          }
          else {
              "enabled=true" >> $env:GITHUB_OUTPUT
          }

      # The runner image's SDK, chosen by global.json, as in the build-test-pack action.
      - name: Show the .NET SDK
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: dotnet --version

      # In the background while the tool builds, as in check; finished before the trust step, because the
      # installer and that step may both write ~\.claude.json.
      - name: Start the Claude Code install
        id: claude
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'claude-install.log'
          $process = Start-Process pwsh -PassThru -ArgumentList '-NoLogo', '-NoProfile', '-Command', "irm https://claude.ai/install.ps1 | iex *> '$log'"
          "pid=$($process.Id)" >> $env:GITHUB_OUTPUT
          Write-Host "Claude Code install started as process $($process.Id), logging to $log."

      # Only the tool: the hand-off check runs bin\Release\net10.0\torni.exe, and dotnet run builds
      # tools\HeadlessTerminal itself. The test projects are built and run by check.
      - name: Build the tool (Release)
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: dotnet build src\Source191.Torni -c Release

      - name: Finish the Claude Code install
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          INSTALL_PID: ${{ steps.claude.outputs.pid }}
        run: |
          $ErrorActionPreference = 'Stop'
          Wait-Process -Id $env:INSTALL_PID -Timeout 300 -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP 'claude-install.log'
          if (Test-Path $log) { Get-Content $log }
          $claude = "$env:USERPROFILE\.local\bin\claude.exe"
          if (-not (Test-Path $claude)) {
              Write-Host '::warning::The background Claude Code install did not finish; installing in the foreground.'
              irm https://claude.ai/install.ps1 | iex
          }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
          & $claude --version

      # The runner has no desktop to accept the trust prompt on, so trust the checkout here. The
      # only places this record is ever written by a script; see .claude\rules\claude-code.md.
      - name: Trust the checkout
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $path = Join-Path $env:USERPROFILE '.claude.json'
          $config = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          $config['hasCompletedOnboarding'] = $true
          if (-not $config.ContainsKey('projects')) { $config['projects'] = @{} }
          $config['projects'][$key] = @{ hasTrustDialogAccepted = $true }
          $config | ConvertTo-Json -Depth 10 | Set-Content $path -NoNewline
          Write-Host "Trusted $key"

      - name: Hand-off check
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        working-directory: tools\HeadlessTerminal
        run: dotnet run --project . -- check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.enabled == 'true'
        with:
          name: handoff-capture
          path: tools\HeadlessTerminal\drive-raw.txt
          if-no-files-found: ignore
