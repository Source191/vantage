name: publish

# Run by hand (Actions, "publish", Run workflow) once a release is tested: it pushes the .nupkg
# already attached to a GitHub Release to nuget.org, so what is published is exactly what was
# built, tested and released from main. It never builds. nuget.org versions cannot be replaced
# (only unlisted), which is why this is not part of release.yml: that publishes a GitHub Release on
# every merge that raises Version, before anyone has tried the package by hand.
#
# No API key is stored. NuGet/login exchanges this run's GitHub identity for a short-lived key
# through a Trusted Publishing policy on nuget.org (owner Source191, repository vantage, workflow
# publish.yml, environment nuget). Only the nuget.org profile name is a secret (NUGET_USER).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The GitHub Release tag to publish, e.g. v0.5.0
        required: true
        type: string

jobs:
  publish:
    name: Push a release's package to nuget.org
    runs-on: windows-latest
    timeout-minutes: 10
    # The nuget environment is what makes the Trusted Publishing key safe: the run waits for the
    # owner's approval, the environment accepts only runs started from main, and the nuget.org policy
    # names this environment, so a copy of this workflow on a branch, or a run an app starts, gets no key.
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag is typed by a person and ends up in a command, so it is checked first and then only
      # ever read from an environment variable, never interpolated into the script.
      - name: Check the tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "'$env:TAG' is not a release tag such as v0.5.0."
          }

      # gh is on the runner. The release's one .nupkg is downloaded; nothing is checked out or built.
      - name: Download the release's package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*.nupkg' --dir package
          if ($LASTEXITCODE -ne 0) {
              throw "gh release download failed with exit code $LASTEXITCODE."
          }
          $packages = @(Get-ChildItem package -Filter *.nupkg)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg on release $env:TAG, found $($packages.Count)."
          }
          Write-Host "Publishing $($packages[0].Name)"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A one-hour API key for the Trusted Publishing policy; it is masked in the log.
      - name: Get a short-lived nuget.org key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Get-ChildItem package -Filter *.nupkg).FullName
          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          exit $LASTEXITCODE
