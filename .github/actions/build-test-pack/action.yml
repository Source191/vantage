name: Build, test and pack
description: >-
  Builds the solution in Release (warnings are errors) with the runner's .NET SDK, runs every test
  project against that build, checks whitespace formatting, then publishes the self-contained winget
  build and zips it. Run by pipeline.yml's check job, whose zip on a release is the one the release job
  publishes, so the release never ships a build that the check did not see.

inputs:
  version-suffix:
    description: >-
      Prerelease suffix added to the csproj Version in the zip's name, e.g. ci.42. Empty names it with
      the plain version. Every run but a release passes one so its zip is told apart from a release's.
    required: false
    default: ''

outputs:
  version:
    description: The version the zip is named for (csproj Version plus any suffix).
    value: ${{ steps.zip.outputs.version }}
  zip:
    description: Path of the winget build's zip, torni_<version>_win-x64.zip, written to artifacts/winget.
    value: ${{ steps.zip.outputs.zip }}

runs:
  using: composite
  steps:
    # The runner image carries the .NET SDKs, and global.json (10.0.301, latestMinor) picks one, so nothing is
    # downloaded; an image without a suitable SDK fails here with the SDK's own message. The line records which
    # SDK built this run (https://learn.microsoft.com/dotnet/core/tools/global-json).
    - name: Show the .NET SDK
      shell: pwsh
      run: dotnet --version

    - name: Build (Release, warnings are errors)
      shell: pwsh
      run: dotnet build -c Release

    - name: Test
      shell: pwsh
      run: dotnet test -c Release --no-build

    # Whitespace only: EnforceCodeStyleInBuild and TreatWarningsAsErrors in Directory.Build.props already fail
    # the build on every style and analyser rule at warning, which is what dotnet format's style and analyzers
    # passes check. Folder mode reads the same .editorconfig without loading an MSBuild workspace (about 2 s
    # against 16 s on the runner) and skips the SDK's generated files under obj unless --include-generated is
    # given. openspec is left out: its archive holds sample .cs files that are not part of the solution.
    # (https://learn.microsoft.com/dotnet/core/tools/dotnet-format)
    - name: Format (whitespace)
      shell: pwsh
      run: dotnet format whitespace --folder --verify-no-changes --exclude openspec

    # The self-contained single-file build winget installs (src\Source191.Torni\README.md, The winget build). It builds
    # the program again for win-x64, so warnings are still errors; the assembly keeps the csproj Version.
    - name: Publish the winget build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (Test-Path artifacts\publish) { Remove-Item -Recurse -Force artifacts\publish }
        dotnet publish src\Source191.Torni -p:PublishProfile=win-x64
        exit $LASTEXITCODE

    - name: Zip the winget build
      id: zip
      shell: pwsh
      env:
        VERSION_SUFFIX: ${{ inputs.version-suffix }}
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Select-Xml -Path src\Source191.Torni\Source191.Torni.csproj -XPath '//Version').Node.InnerText
        if (-not [string]::IsNullOrEmpty($env:VERSION_SUFFIX)) {
            $version = "$version-$env:VERSION_SUFFIX"
        }
        $zip = Join-Path (Get-Location) "artifacts\winget\torni_$($version)_win-x64.zip"
        .github/scripts/Compress-WingetBuild.ps1 -PublishFolder artifacts\publish -Destination $zip
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "version=$version" >> $env:GITHUB_OUTPUT
        "zip=$zip" >> $env:GITHUB_OUTPUT
