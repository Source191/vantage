schema: spec-driven

context: |
  Vantage is a terminal console for Claude Code sessions and git worktrees on Windows 11, packaged as the dotnet global tool `vantage`.
  Windows only: Windows Terminal (wt.exe, 1.25 or later), PowerShell 7, the Claude Code CLI 2.1.309 or later, git. No macOS or Linux support in this version.
  Sessions Vantage starts are background sessions under Claude Code's supervisor (claude --bg -n <name>). Vantage shells out to claude attach rather than hosting a session itself.
  Depend only on the documented CLI surface: claude agents --json [--all], claude --bg, claude attach, claude stop, claude rm, claude --bg --resume, claude logs <id> (the screen history the detail pane shows and never records). Never parse transcript JSONL or the ~/.claude/sessions folder beyond checking that a transcript file exists. Resolve names to IDs before stop or rm, because those take only IDs.
  New worktrees go to <worktree root>\<repository>-<slug> on a branch named <slug>, never under .claude/worktrees; the worktree root is a setting (default worktrees beside the first repository root). Sibling worktrees made by versions before 0.8.0 stay where they are and are still listed and removed. Vantage creates and removes them itself with git worktree commands.
  A new worktree is the wizard's default launch mode; the current branch is the alternative, and the only mode for a fixed folder (s on the worktrees view) and vantage here.
  Windows Terminal can open a tab (title, tabColor, startingDirectory, suppressApplicationTitle); its command line can only focus a tab by index and cannot list tabs, but Windows UI Automation can select a tab item by its title in the owning WindowsTerminal.exe window, which is how Vantage switches to a tab it opened. A tab can set its own title (OSC 2) and tab background (OSC 4 palette entry 264) with escape sequences unless it was launched with an explicit tabColor. A tab closes by itself when its root shell exits with code 0.
  Never delete a worktree that has uncommitted changes, unpushed commits, a lock, or a live session inside it without an explicit force confirmation.
  Attention is the terminal bell: Claude Code's preferredNotifChannel terminal_bell for attached tabs, Vantage's own bell when a background row starts waiting. There are no toasts and no hooks.
  Technology: C# on .NET 10. Tests with xunit.v3, Shouldly, NetArchTest.Rules and SonarAnalyzer.CSharp; warnings are errors. Test-driven development; no untested code except Program.cs and dependency injection wiring.
  Sociable unit tests: real collaborators inside the domain; test doubles only at boundaries (claude CLI, git, wt.exe, file system, process table, state files, clock via TimeProvider), hand-written fakes in test\...\TestDoubles rather than a mocking library.
  Layering, enforced by an architecture test: Domain depends on nothing else; Ports depends only on Domain; Application (use cases, read models, reducers) depends on Domain and Ports, never on Adapters or Tui; Adapters and Tui depend on Application and below; Program.cs is the only composition root. Nothing outside Adapters touches System.IO.File, System.IO.Directory or System.Diagnostics.Process; nothing outside Tui touches Terminal.Gui.
  Projects: Source191.Vantage.Core (Domain, Ports, Application), Source191.Vantage.Infrastructure (adapters), Source191.Vantage.Tui (Terminal.Gui), Source191.Vantage (Program.cs, the packed tool); tests in Core.Tests (in-memory), Infrastructure.Tests (real git, processes, files), TestDoubles (shared fakes) and tools\HeadlessTerminal.Tests.
  Every piece of work, including refactors and tooling, starts as an OpenSpec change; a change with no behaviour change declares skip_specs: true; the change is archived in the pull request that completes it.
  Coding style: concrete types not var, Model model = new() initialisation, never omit braces, primary constructors, records, immutable objects, collection expressions, file-scoped namespaces, nullable enabled, async/await, DateTimeOffset in UTC, pattern matching over if-else chains. British English in all text.
  The verified Claude Code CLI and Terminal.Gui facts live in CLAUDE.md; keep artifacts consistent with them.

rules:
  proposal:
    - State what is out of scope, including multiple Claude accounts, which is a later change
  tasks:
    - Each task is one red-green-refactor cycle or smaller, with the test named before the code
    - Order tasks so the pure domain rules come before adapters and adapters before screens
    - A task that adds a key or an effect names its handler (the IEffectHandler class and its test) after the adapters it uses and before the screen or dialog that raises it
